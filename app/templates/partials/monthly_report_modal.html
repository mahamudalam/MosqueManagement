<div class="modal fade" id="monthlyReportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-calendar-month"></i>
                    Monthly Report
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>
            <div style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <strong>Note:</strong> Report is available from <strong>July 2026</strong> onwards.
            </div>
            <!-- Modal Body -->
            <div class="modal-body">

                <div class="row">

                    <!-- Year -->
                    <div class="col-md-6 mb-3">
                        <label for="reportYear" class="form-label fw-bold">
                            Year
                        </label>

                        <select class="form-select" id="reportYear">

                            {% for year in range(2026, 2036) %}

                                <option value="{{ year }}">
                                    {{ year }}
                                </option>

                            {% endfor %}

                        </select>
                    </div>

                    <!-- Month -->
                    <div class="col-md-6 mb-3">
                        <label for="reportMonth" class="form-label fw-bold">
                            Month
                        </label>

                        <select class="form-select" id="reportMonth">

                            <option value="">Select Month</option>

                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>

                        </select>
                    </div>

                </div>

                <hr>

                <!-- Report -->
                <div id="monthlyReportCard" class="report-scroll">

                    <div class="text-center text-muted py-5">
                        <i class="bi bi-calendar3 fs-1"></i>

                        <p class="mt-3 mb-0">
                            Please select Year and Month.
                        </p>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
